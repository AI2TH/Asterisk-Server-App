; pjsip.conf — PJSIP configuration for Stardial (WebRTC + SIP.js capable)
; Transports are static. Extension stanzas are managed by the API server.

[global]
type=global
user_agent=Stardial PBX 1.0
; Allow registration from behind NAT
endpoint_identifier_order=username,ip,anonymous

; ---------- Transports ----------

; Standard UDP SIP (traditional SIP clients)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Standard TCP SIP
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; WebSocket — SIP.js / WebRTC (plaintext WS, loopback only)
; Reachable from Android via SLIRP hostfwd tcp::8088-:8088
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; WebSocket TLS — SIP.js production (WSS)
; Reachable from Android via SLIRP hostfwd tcp::8089-:8089
; Requires /etc/asterisk/keys/asterisk.pem (generated by init_bootstrap.sh)
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key

; ---------- Extensions (managed by API server) ----------
; Each extension gets 3 stanzas: endpoint, auth, aor
; WebRTC-capable endpoints include DTLS/SRTP settings.
;
; Example (do NOT uncomment — added programmatically):
;
; [1001]
; type=endpoint
; context=from-internal
; disallow=all
; allow=opus,ulaw,alaw,g722
; auth=auth1001
; aors=aor_1001
; ; WebRTC (SIP.js) settings:
; dtls_enable=yes
; dtls_verify=fingerprint
; dtls_cert_file=/etc/asterisk/keys/asterisk.pem
; dtls_ca_file=/etc/asterisk/keys/asterisk.pem
; dtls_setup=actpass
; ice_support=yes
; media_encryption=dtls
; rtcp_mux=yes
; direct_media=no
; force_rport=yes
;
; [auth1001]
; type=auth
; auth_type=userpass
; username=1001
; password=secret
;
; [aor_1001]
; type=aor
; max_contacts=5
; remove_existing=yes
