; http.conf — Asterisk built-in HTTP server
; Serves both ARI (REST) and WebSocket SIP (SIP.js / WebRTC)
;
; Ports forwarded via SLIRP:
;   tcp::8088-:8088  — plain HTTP/WS  (ARI + SIP.js ws:)
;   tcp::8089-:8089  — TLS HTTPS/WSS  (SIP.js wss:)

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=asterisk

; TLS for WSS (required by SIP.js in production and Chrome enforcement)
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivkeyfile=/etc/asterisk/keys/asterisk.key
