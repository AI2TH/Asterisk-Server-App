; extensions.conf — Dial plan for Stardial PBX

[general]
static=yes
writeprotect=no

; Internal extensions — all registered PJSIP endpoints
[from-internal]
exten => _X.,1,NoOp(Stardial: Dial ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; Voicemail retrieval
exten => *97,1,VoicemailMain()
 same => n,Hangup()

; Echo test — dial 9999 to hear your own voice back
exten => 9999,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Demo audio — dial 9998
exten => 9998,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()
